name: MindEcliptic Destiny Matrix — Automated Video Edit

on:
  push:
    branches:
      - video/destiny-matrix-editor
    paths:
      - "video/destiny_matrix.py"
      - ".github/workflows/destiny-matrix-edit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Python tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet numpy pillow
      - name: Download already-created HeyGen footage and Cassidy narration, and edit
        run: python video/destiny_matrix.py
      - name: Save completed Shorts MP4 (no HeyGen regeneration)
        uses: actions/upload-artifact@v4
        with:
          name: MindEcliptic-Destiny-Matrix-FINAL-MP4
          path: video/output/MindEcliptic_Destiny_Matrix_vs_Numerology_FINAL.mp4
          retention-days: 30
          if-no-files-found: error
